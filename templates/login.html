{% extends "base.html" %}
{% block contenido %}
<div class="card" style="max-width: 350px; margin: 60px auto; text-align: center;">
  <h2>Autos Colombia</h2>
  <p>Ingreso al sistema</p>
  <form method="post">
    <input name="username" placeholder="Usuario" required>
    <input name="password" type="password" placeholder="Contraseña" required>
    <button class="azul">Ingresar</button>
  </form>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
</div>
{% endblock %}
