{% extends "base.html" %}
{% block contenido %}
<div class="tarjetas">
  <div class="card">
    <h3>Registrar entrada</h3>
    <form method="post" action="/entrada">
      <input name="placa" placeholder="Placa (ej: ABC123)" required>
      <button class="verde">Registrar entrada</button>
    </form>
  </div>
  <div class="card">
    <h3>Registrar salida</h3>
    <form method="post" action="/salida">
      <input name="placa" placeholder="Placa (ej: ABC123)" required>
      <button class="naranja">Registrar salida</button>
    </form>
  </div>
</div>
{% endblock %}
